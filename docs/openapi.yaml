openapi: 3.0.3
info:
  title: PsyPedia API
  version: 0.1.0
  description: |
    API contract for the currently implemented PsyPedia backend.
    Health and mock chat endpoints are available. No AI model is connected.
    The contract version does not imply a published application release.
servers:
  - url: /api
    description: Same-origin API through the Vite development proxy
  - url: http://localhost:{backendPort}/api
    description: Direct access to Flask through its published development port
    variables:
      backendPort:
        default: '5000'
        description: Set to BACKEND_PORT from the root .env if overridden.
tags:
  - name: Health
    description: Backend availability
  - name: Chat
    description: Mock conversation endpoint
security: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check backend availability
      description: |
        Returns a fixed status when Flask can serve the request.
        Does not check databases, model providers, or other dependencies.
        No authentication or request body is required.
      responses:
        '200':
          description: The backend is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /chat:
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Submit a question and receive a mock answer
      description: No model is called, no clinical answer is generated, and messages are not stored. Additional request fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: What is psychotherapy?
      responses:
        '200':
          description: A clearly identified mock response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Malformed JSON, a non-object body, or a missing, blank, or non-string message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request Content-Type is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
          description: Backend availability status.
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          pattern: '\S'
          description: Must contain at least one non-whitespace character.
    ChatResponse:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer:
          type: string
          example: 'Mock response: the assistant is not connected yet. No clinical answer has been generated.'
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_message, unsupported_media_type]
            message:
              type: string
