openapi: 3.0.3
info:
  title: PsyPedia API
  version: 0.1.0
  description: |
    API contract for the currently implemented PsyPedia backend.
    Health and chat endpoints are available. Local Ollama generation uses a small demo knowledge base with lexical lookup.
    The contract version does not imply a published application release.
servers:
  - url: /api
    description: Same-origin API through the Vite development proxy
  - url: http://localhost:{backendPort}/api
    description: Direct access to Flask through its published development port
    variables:
      backendPort:
        default: '5000'
        description: Set to BACKEND_PORT from the root .env if overridden.
tags:
  - name: Health
    description: Backend availability
  - name: Chat
    description: Local generation using demo topic cards
security: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check backend availability
      description: |
        Returns a fixed status when Flask can serve the request.
        Does not check databases, model providers, or other dependencies.
        No authentication or request body is required.
      responses:
        '200':
          description: The backend is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /chat:
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Submit a question and receive an answer
      description: |
        Returns an Ollama-generated answer from demo cards, or a fixed reply in mock mode.
        Emergency and patient-data checks run before either provider; these are limited
        heuristics, not clinical risk assessment or anonymisation.
        Recent history is optional, validated, and not persisted by the backend.
        Card source links remain inside answer; no structured sources field is returned.
        Fixed replies use Spanish; generated replies are instructed to do so.
        See [routing and limitations](../backend/LLM_AND_PROMPTING.md#how-it-works).

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: ¿Qué es ACT?
      responses:
        '200':
          description: A generated answer or fixed service reply, including mock and routing responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Malformed JSON, invalid message, or invalid conversation history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request Content-Type is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Ollama returned an invalid answer or repeated a previous answer after the bounded rewrite policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Ollama service or configured model is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Ollama generation timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
          description: Backend availability status.
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          pattern: '\S'
          description: Must contain at least one non-whitespace character.
        history:
          type: array
          maxItems: 12
          description: Recent turns before the current message; optional and not persisted.
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 4000
                pattern: '\S'
    ChatResponse:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer:
          type: string
          minLength: 1
          example: 'No tengo información suficiente sobre ese aspecto para darte una respuesta fiable.'
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_message, invalid_history, unsupported_media_type, provider_unavailable, provider_timeout, invalid_provider_response]
            message:
              type: string
