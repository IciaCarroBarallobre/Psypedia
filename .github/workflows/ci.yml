
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test chat components
        run: npm test

      - name: Build Vue and TypeScript
        run: npm run build

  backend:
    name: Backend / checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run backend tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  integration:
    name: Integration / Vite to Flask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: psypedia-integration
      FRONTEND_PORT: '5173'
      BACKEND_PORT: '5000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker services
        run: docker compose -f compose.dev.yaml up --build --wait --wait-timeout 120

      - name: Test API proxy over HTTP
        run: make test-integration

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color

      - name: Clean up containers and volumes
        if: always()
        run: docker compose -f compose.dev.yaml down --volumes --remove-orphans
